name: News bot

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  post-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run bot once
        env:
          RUN_ONCE: "1"
          PYTHONUTF8: "1"
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GAMES_CHANNEL_ID: ${{ secrets.GAMES_CHANNEL_ID }}
          ANIME_CHANNEL_ID: ${{ secrets.ANIME_CHANNEL_ID }}
          MANGA_CHANNEL_ID: ${{ secrets.MANGA_CHANNEL_ID }}
          MOVIES_CHANNEL_ID: ${{ secrets.MOVIES_CHANNEL_ID }}
        run: python news_bot.py

      - name: Save the list of sent news
        if: always()
        run: |
          if [ -f seen.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git diff --cached --quiet || (git commit -m "update seen list" && git push)
          fi
